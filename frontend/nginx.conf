server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: semua route tak dikenal -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset hasil build Vite (nama file di-hash) boleh cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker & manifest harus selalu fresh supaya update lama ter-pakai
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Semua request /api diteruskan ke PHP-FPM (Slim = front controller)
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 120s;
    }
}